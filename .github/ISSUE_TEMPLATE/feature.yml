name: Feature request
description: Propose a change that fits the current architecture
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read [AGENTS.md](https://github.com/midhunadarvin/software-factory/blob/main/AGENTS.md) before proposing a new database, UI framework, webhook route file, or lane system. Those are declined by design.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can an operator or contributor not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Where in the tree would this live (see AGENTS.md “Where code goes”)?
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This does not add a second database, queue, or UI framework
          required: true
        - label: Intake sources would be IntegrationPlugins (no new `/api/webhooks/<name>/route.ts`)
          required: true
        - label: Persistence stays under `var/`
          required: true
